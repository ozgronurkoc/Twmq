[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spor-toto-kapsama"
version = "4.0.0"
description = "Spor Toto duz (tam sistem) kupon ureticisi ve olcum katmani"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "flask>=3.0",
    "gunicorn>=26.0.0",
]

[project.optional-dependencies]
#: `pytest-randomly` `sports-betting` incelemesinden geldi. Suite zaten
#: `-n auto` ile kosuyor, yani sira ZATEN belirsiz — ama belirsizlik
#: SESSIZDI: testler arasi gizli bir bagimlilik ancak sanssiz bir
#: dagitimda ortaya cikardi ve tekrar uretilemezdi. Rastgele tohum onu
#: gorunur ve tohumla TEKRAR EDILEBILIR kilar.
test = ["pytest>=7", "pytest-xdist>=3", "pytest-randomly>=3.15"]
#: Model ekstrasi — CALISMA ZAMANI bagimliligi degil. Servis egitmez;
#: `web_app` ice aktarimda ne `sklearn` ne `lightgbm` yukler (olculdu —
#: `arena.py` gibi yerlerde importlar fonksiyon govdesinde, tembel).
#: `spor_toto.agac` yoklugunu `HAS_LIGHTGBM` ile denetler ve modul yine
#: ice aktarilabilir (`core.HAS_SCIPY` deseni).
#:
#: ONCE BURADA "`scripts/run_prod.sh` kurmaz" YAZIYORDU VE YANLISTI.
#: `.replit` `[deployment] build` -> `scripts/build.sh` -> `scripts/setup.sh`
#: zinciri bu ekstrayi (ve `test`i) deploy imajina kuruyor. Yani paketler
#: uretim imajinda VAR; olan sey calisma zamani bagimliligi degil, imaj
#: sismesi. Cumle gercege gore duzeltildi, davranis DEGISTIRILMEDI — deploy
#: kurulum kumesini daraltmak ayri bir karar ve ayri bir risk.
#:
#: `alphapy-pro`'nun KENDISI alinmadi: Python >= 3.12 istiyor ve bizim
#: `.replit` 3.10 kosuyor. Yalnizca isaret ettigi kutuphaneler alindi ve
#: her biri kendi katlayicimiza (`arama.SezonKatlayici`) baglandi —
#: ayrinti `docs/DIS_INCELEME_ALPHAPY.md` §4.1.
model = ["scikit-learn>=1.4", "lightgbm>=4.3"]
#: Kalite kapisi. Uretim bagimliligi DEGIL — `pip install -e ".[kalite]"`
#: ile ayrica kurulur, boylece calisan servis onlari tasimaz.
#:
#: `bandit` YOK ve GEREKCESI BIR ZAMANLAR YANLISTI. Burada "ruff'in
#: `select` listesi zaten `S` (flake8-bandit) kurallarini kosuyor"
#: yaziyordu; asagidaki `[tool.ruff.lint] select` listesine bakin:
#: `S` ORADA DEGIL. Ayni cumle `docs/DIS_INCELEME_SPORTS_BETTING.md`de
#: iki kez daha tekrarlaniyordu. Yani ikinci bir arac reddedildi, birincisi
#: hic acilmadi ve guvenlik lint'i bu depoda HICBIR YERDE kosmadi.
#:
#: OLCULDU (2026-09-03, `ruff check --select S --statistics`): 3.037 bulgu.
#: 2.966'si `S101` (`assert`) ve o saf gurultu — suit ve `health` bilerek
#: `assert` uzerine kurulu. `S101` ve `tests/` disarida birakilinca geriye
#: 36 bulgu kaliyor: 14 `S310` (`urlopen` semasi denetlenmiyor), 11 `S311`
#: (Monte Carlo'nun `random`i — dogru ve zararsiz), 5 `S607` + 4 `S603`
#: (`git` kismi yolla cagriliyor), 1 `S104`, 1 `S112`.
#:
#: Yani `S`yi acmak KUCUK ve SINIRLI bir is; yapilmadi cunku 36 bulgunun
#: her biri ya bir gerekce yorumu ya da gercek bir sertlestirme istiyor ve
#: bu ayri bir karar. Degisen sey yalnizca CUMLENIN DOGRULUGU: artik
#: "kosuyor" demiyor, "kosmuyor ve bedeli su" diyor.
#:
#: `pip-audit` ve `interrogate` ruff'in bakmadigi iki seye bakiyor —
#: bagimlilik aciklari ve docstring kapsamasi.
kalite = ["ruff>=0.16", "mypy>=1.11", "pip-audit>=2.7", "interrogate>=1.7",
          # `scripts/bagimliliklar.py` TOML okur ve `tomllib` stdlib'e
          # 3.11'de girdi. Kapi bilerek 3.10'a sabitli, yani orada betik
          # `ModuleNotFoundError` veriyordu — CI'nin kalite kapisi bu
          # yuzden HIC gecmedi. Geri dusus paketi yalnizca 3.10'da kurulur.
          "tomli>=2; python_version < '3.11'"]

#: OCR ekstrasi — URETIM BAGIMLILIGI DEGIL ve varsayilan kuruluma GIRMEZ.
#: Yalnizca `scripts/build_bulten.py` kullanir ve o, deponun stdlib disina
#: cikan tek uretim betigidir. Ayrica bir SISTEM paketi de ister:
#:
#:     apt-get install tesseract-ocr tesseract-ocr-tur
#:
#: `scripts/check.sh` ve CI bunlari kurmaz; `tests/test_bulten.py` OCR'a
#: dokunan testleri bagimlilik yoksa ATLAR ve saf ayristirma testleri her
#: yerde kosar. Uretilen cikti surumlendigi icin veriyi OKUMAK icin kimsenin
#: tesseract kurmasi gerekmez — yalnizca YENIDEN URETMEK icin gerekir.
ocr = ["pillow>=10"]

#: MCP ekstrasi — DENEY, URETIM BAGIMLILIGI DEGIL (bkz. `mcp_server.py`).
#: `run_prod.sh` kurmaz, `.replit` bilmez, suite yoksa ATLAR.
#:
#: Ayak izi kucuk degil: `mcp` starlette + uvicorn (ASGI) getiriyor, yani
#: mevcut Flask/gunicorn (WSGI) yiginin yanina IKINCI bir sunucu yigini.
#: Varsayilan kuruluma girmemesinin sebebi budur.
#:
#: `<2` pini kasitli DEGIL — tam tersi: 2.x'te `FastMCP` `MCPServer` oldu
#: ve `sports-betting`in kendi `mcp>=1.2` pini bugun kurulunca KENDI
#: kodunu kiriyor. Biz 2.x API'siyle yazdik ve alt siniri oraya koyduk.
mcp = ["mcp>=2.0"]

[project.scripts]
spor-toto = "spor_toto.cli:main"

[tool.setuptools.packages.find]
include = ["spor_toto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` cekirdek basina bir isci acar. Suite'in agirligi korpus
# uzerinde donen bagimsiz modullerde ve tek surecte 4 cekirdegin ucu bos
# duruyordu: 142 sn -> 77 sn (4 cekirdek).
#
# Dagitim kipi bilerek varsayilan (`load`): testleri modulden bagimsiz,
# bosalan isciye verir. `loadscope`/`loadfile` bir modulu tek isciye
# baglar ve en agir modul kritik yola donusur — olculdu, ikisi de daha
# yavas (83 sn ve 89 sn).
#
# Tek bir dosyayi kosarken ~0,7 sn sabit ek yuk getirir; hata ayiklarken
# `-n0` ile kapatilir (cikti sirasi da o zaman duzelir).
addopts = "-q --strict-markers -n auto"
# "ILP testleri" YAZIYORDU ve kaplama sokulunce yanlis oldu: ILP cozucu
# `engines.py` ile birlikte gitti. Bugun `slow` isaretli 24 testin hicbiri
# ILP degil — korpus uzerinde donen olcumler (`karne` 8, `deger` 2,
# `fiyatlar` 2, `hafta_hakki` 2, `hakem` 2, `kalabalik` 2, digerleri 1'er).
# Isaretin anlami sure, konu degil.
markers = ["slow: uzun suren olcum testleri (korpus uzerinde doner)"]


# ─── Ruff ─────────────────────────────────────────────────────────────────
#
# Depoda hicbir linter/formatter yoktu; ironik olarak `.gitignore` zaten
# `.ruff_cache/` ve `.mypy_cache/`i yok sayiyordu — niyet vardi, araclar hic
# gelmedi.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — kullanilmayan import/degisken
    "I",        # isort — import sirasi
    "UP",       # pyupgrade
    "B",        # bugbear — sessiz hata sinifi
    "C4",       # comprehension
    "RUF",      # ruff'in kendi kurallari
    "S",        # flake8-bandit — guvenlik
]
ignore = [
    # Turkce docstring ve yorumlar uzun; satir uzunlugu formatter'in isi.
    "E501",
    # `zip()` icin strict= py3.10'da yok (asgari surumumuz 3.10).
    "B905",
    # RUF001/002/003 — "belirsiz unicode karakter". Bu kural Kiril/Yunan
    # benzerlerini yakalamak icin var ama TURKCE harfleri de isaretliyor:
    # `ı`, `ş`, `ğ`, `ç` ve tipografik tirnak/tire. Depodaki butun
    # docstring ve yorumlar Turkce oldugu icin tek basina 7.017 bulgu
    # uretiyordu — yani gercek bulgularin uzerini orten saf gurultu.
    "RUF001", "RUF002", "RUF003",

    # ─── S (flake8-bandit) — iki kural DEPO GENELINDE kapali ───────────
    #
    # `S` acilirken ham toplam 3.037 bulguydu. Ikisi tek tek `noqa`
    # edilecek turden degil, DEPONUN TAMAMI icin gecerli birer olgu:
    #
    # S101 (`assert`) — 2.966 bulgu, yani hamin %98'i. Suit `assert`
    # uzerine kurulu ve `spor_toto/health` degismezleri de bilerek
    # `assert` ile yaziyor (rapor gövdesi hatanin metnini tasiyor).
    # Kural Python'un `-O` ile assert'leri atmasina karsi uyariyor; bu
    # depo `-O` ile kosmuyor ve kosarsa saglik katmani zaten anlamsizlasir.
    # Tek tek susturmak 2.966 satirlik gurultu demekti.
    "S101",
    # S311 (`random` kriptografik degil) — 11 bulgu, hepsi Monte Carlo
    # ve bootstrap: `analysis`, `core`, `deger`, `engines`, `evaluate`,
    # `kuyruk`. Bu depoda KRIPTOGRAFI YOK; dahasi bu cagrilarin
    # TEKRAR EDILEBILIR olmasi gerekiyor (tohumlu), yani CSPRNG dogru
    # cevap DEGIL — yanlis cevap olurdu. Depo genelinde gecerli bir
    # olgu oldugu icin depo genelinde yaziliyor.
    "S311",
    # S607 (`git`/`tesseract` PATH'ten cagriliyor) — 5 bulgu. Tam yol
    # yazmak BILEREK reddedildi: `git` Replit'te, CI'da ve gelistirici
    # makinesinde ayri yerlerde duruyor ve sabit bir yol tasinabilirligi
    # kirar. PATH'ten cozmek bu deponun POLITIKASI, dolayisiyla depo
    # genelinde yaziliyor.
    #
    # S603 (`subprocess` cagrisi) BILEREK ACIK BIRAKILDI. Ruff onu her
    # `subprocess.run` cagrisinda atesler, yani bir dedektor degil bir
    # hatirlaticidir — ve hatirlatmasi istenen sey degerli: her yeni
    # cagri, argumanlarinin nereden geldigine dair BILINCLI bir karar
    # gerektirsin. Bugunku alti cagrinin altisi da degismez argv listesi
    # (kabuk yok, kullanici girdisi yok) ve her biri satirinda gerekcesini
    # yaziyor.
    "S607",
]

[tool.ruff.lint.per-file-ignores]
# `core.__all__` alfabetik DEGIL, KONUYA gore gruplu ve her grubun basinda
# bir yorum var (sabitler / ayristirma / mesafe / cozucu / rapor / hata).
# Alfabetik siralamak o gruplamayi ve aciklamalari birbirine karistirirdi;
# listenin dogrulugunu zaten `test_all_modulun_gercek_yuzeyini_sayar` tutuyor.
"spor_toto/core.py" = ["RUF022"]
# Testlerde ve betiklerde `sys.path` ayarindan SONRA import etmek zorunlu:
# betikler paket kurulmadan da kosabilmeli.
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

# ─── mypy ─────────────────────────────────────────────────────────────────
#
# KADEMELI: cekirdek sozlesme modulleri siki, kalani taban cizgisiyle
# baslar. Hepsini birden sikilastirmak ~9k satirda yuzlerce hata uretir ve
# hicbiri okunmadan susturulurdu.
[tool.mypy]
python_version = "3.10"
#: `scripts` ve `tests` DE denetleniyor. Onceden liste
#: `["spor_toto", "web_app.py"]`ti, yani `backend/scripts/` (26 dosya,
#: 11.499 satir) ve `backend/tests/` (66 dosya, 18.849 satir) tip
#: denetiminin TAMAMEN disindaydi — deponun Python govdesinin yarisindan
#: fazlasi.
#:
#: Acilinca 57 bulgu cikti ve HEPSI kapatildi (bastirma yok, `ignore_errors`
#: eklenmedi). Cogu cikarim gurultusuydu ama ikisi gercekti:
#:
#:   * `tests/test_evaluate.py` iki farkli `_kayit` tanimliyordu; Python son
#:     tanimi alir, yani dosyanin ilk yarisindaki alti cagri yanlis govdeye
#:     dusuyordu. `_kayit(i, 0.50)` `brier_toplam=i, n=0.50` olarak
#:     okunuyordu — hafta indeksi Brier toplami, Brier ortalamasi mac sayisi
#:     yerine. `test_bootstrap_tohumu_gercekten_kullanir` docstring'inde
#:     "haftalar bilerek birbirinden cok farkli" diyordu; golgelenmis halde
#:     iki grubun `brier_toplam`i BIREBIR AYNIYDI. Testler geciyordu ama
#:     yazdiklari seyi olcmuyorlardi.
#:   * `scripts/super_toto_tahmin2.py` bolen sifirken `kat: None` donuyordu;
#:     `super_toto_frontend.py` onu `round(..., 3)` ile okuyor ve arayuz
#:     `kat_taban: number` deyip `.toFixed(1)` cagiriyor. Koruma cokmeyi
#:     onlemiyor, iki katman asagi itiyordu. Artik kaynakta hata veriyor.
#:
#: NOT — bu kapi `tomllib` kusurunu YAKALAMAZDI. Olculdu: mypy
#: `import tomllib`i `python_version = "3.10"` ile de, kendisi 3.10 altinda
#: kosarken de, `--python-executable` ile de sorun saymiyor. O kusurun
#: bekcisi `test_betikler_asgari_python_surumunde_ICE_AKTARILABILIR`tir.
files = ["spor_toto", "web_app.py", "scripts", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

# Arayuzun okudugu govdeyi ureten moduller — sozlesme burada kirilir.
[[tool.mypy.overrides]]
module = ["spor_toto.meta", "spor_toto.payloads", "spor_toto.ortak"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# Arastirma ve olcum katmani: kademeli olarak daraltilacak.
[[tool.mypy.overrides]]
module = [
    "spor_toto.bahisci", "spor_toto.cizgi", "spor_toto.disari",
    "spor_toto.egitim", "spor_toto.evaluate", "spor_toto.kalibrasyon",
    "spor_toto.recalibrate", "spor_toto.markov", "spor_toto.analysis",
    "spor_toto.fire_scenarios", "spor_toto.backtest", "spor_toto.benzer",
    "spor_toto.odds", "spor_toto.history", "spor_toto.predict",
    "spor_toto.tahmin", "spor_toto.health", "spor_toto.health_history",
    # `spor_toto.engines` BURADAN KALKTI: modul kaplamayla birlikte
    # sokuldu (`docs/DUZ_SISTEME_GECIS.md`) ama adi listede kaldi ve mypy
    # her kosumda "unused section(s)" diye uyariyordu — kapiyi kirmayan,
    # o yuzden de kimsenin okumadigi bir uyari.
    "spor_toto.core", "spor_toto.report",
    "spor_toto.cli", "spor_toto.bayes",
]
ignore_errors = true


# ─── interrogate (docstring kapsamasi) ────────────────────────────────────
#
# Bu depoda docstring bir gelenek: her modul kendi GEREKCESINI yaziyor ve
# okunacak asil belge odur. Gelenek ancak bir kapiya baglanirsa kural
# olur.
#
# Esik ONCE OLCULDU (o gun %75,9; 2026-09-03'te %76,9), sonra biraz
# altina konuldu. KAPSAMA SAYISI KODLA BIRLIKTE OYNAR — sabit olan esiktir
# (%75). Bu yuzden yuzdenin kendisi bir belgeye tek basina yazilmamali;
# yazildigi uc yerde uc farkli deger olusmustu ve ucu de bayatti. Ilk yazilan deger
# 90'di ve bu bir TAHMINDI — kapi onu hemen dusurdu, ki isi de budur.
#
# Eksiklerin neredeyse tamami dusuk degerli: `main()` giris noktalari,
# `Tahminci` sozlesmesini uygulayan `egit`/`tahmin` govdeleri (gerekce
# sinifin kendi docstring'inde) ve sklearn'in `get_n_splits`i. Kapinin
# isi mukemmellik degil TABANI korumak: yeni bir modul gerekcesiz
# giremesin.
#
# `tests/` disarida: test adlari zaten cumle ve modul basliklari
# gerekceyi tasiyor; her `def test_...`e docstring zorlamak, bilgi
# tasimayan tek satirlik docstringler uretirdi.
[tool.interrogate]
fail-under = 75
exclude = ["tests", "data", "build", "scripts"]
ignore-init-method = true
ignore-magic = true
ignore-private = false
ignore-nested-functions = true
omit-covered-files = false
quiet = false
