name: iddaa bulten snapshot

# NE ISE YARAR
# ============
# Gecmis iddaa orani hicbir kaynakta yayinlanmiyor (bkz.
# docs/VERI_TOPLAMA_VE_ISLEME.md §3.2). Bu is haftada bir acik bultenin o
# anki halini alip depoya isler; bir sezon sonunda kendi iddaa arsivimiz
# olur. Deger tek snapshot'ta degil, birikimde.
#
# ZAMANLAMA ACIK
# ==============
# Bu is haftada bir CALISIR ve yeni snapshot varsa depoya COMMIT ATAR.
# Yazdigi tek yer `backend/data/iddaa/` — baska hicbir dosyaya dokunmaz ve
# degisiklik yoksa commit de atmaz.
#
# Durdurmak icin: Actions sekmesi -> bu is -> "..." -> "Disable workflow"
# (ya da asagidaki `schedule` blogunu yorumla). Durdurmanin bedeli, o
# haftanin bulteninin bir daha ele gecmemesidir — gecmis oran hicbir
# kaynakta yayinlanmiyor.
#
# Elle calistirmak icin: Actions sekmesi -> bu is -> "Run workflow".

on:
  workflow_dispatch:
  schedule:
    # Her pazartesi 06:00 UTC (TR 09:00) — hafta kuponu aciktayken.
    # GitHub zamanlanmis isleri yogunlukta oteleyebilir; gun icinde kayma
    # onemli degil, bulten gun boyu ayakta.
    - cron: "0 6 * * 1"

# Iki calisma ust uste binerse ikisi de ayni dosyaya yazip push yarisina
# girer. Ayni anda tek calisma yeter; bekleyen is iptal EDILMEZ, cunku
# atlanan bir hafta geri gelmiyor.
concurrency:
  group: iddaa-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Script yalnizca standart kutuphane kullanir; bagimlilik kurulmaz.
      - name: Bulteni al
        run: python scripts/snapshot_iddaa.py

      # `-o addopts=` ZORUNLU ve ihmal edilirse bu adim HIC KOSMAZ.
      # `backend/pyproject.toml` `addopts` icinde `-n auto` tasiyor; o
      # `pytest-xdist`in bayragidir ve buraya bilerek yalnizca `pytest`
      # kuruluyor. Xdist yokken pytest tek test govdesine girmeden
      # "unrecognized arguments: -n" ile cikis 4 verir — olculdu, ve bu
      # adim tam olarak boyle sessizce oluydu.
      #
      # Care olarak xdist kurulmadi: bu is bilerek bagimliliksiz kosuyor ve
      # tek dosyalik bir suit icin paralellik zaten kazanc getirmez.
      # `--strict-markers` korunuyor, yalnizca `-n auto` dusuruluyor.
      #
      # Ayni tuzak `scripts/setup.sh`te bir paragrafla anlatiliyor; ders
      # orada ogrenilmis, buraya uygulanmamisti.
      - name: Bicimi denetle
        run: |
          pip install -q pytest
          pytest -q -o addopts="--strict-markers" tests/test_snapshot_iddaa.py

      - name: Degisiklik varsa isle
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Yalnizca arsiv dizini. Baska bir dosya degistiyse (olmamali)
          # bu is onu islemez — botun yazma alani tek bir yer.
          git add backend/data/iddaa
          if git diff --cached --quiet; then
            echo "yeni snapshot yok — islenecek degisiklik bulunamadi"
            exit 0
          fi
          git commit -m "veri: iddaa bulten snapshot $(date -u +%Y-%m-%d)"

          # Dal bu arada ilerlemis olabilir. Veri dosyasi commit'i cakismaz;
          # rebase ile ustune bindirip acik hedefe push ediyoruz (schedule
          # calismasinda checkout ayrik HEAD olabilir).
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
