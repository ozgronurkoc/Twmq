name: tests

on:
  push:
    branches: [main]
  pull_request:

# Iki is var ve ayrimi bilincli:
#
#   matris  — testleri DESTEKLENEN her Python surumunde kosar. Amaci
#             tasinabilirlik: bir surume ozgu kirilma erken gorunsun.
#   kapi    — `scripts/check.sh`i cagirir, yani gelistiricinin yerelde
#             kostugu KOMUTUN AYNISINI. Adimlar burada YENIDEN YAZILMAZ;
#             once oyle yapiliyordu ve ikisi ayrismisti: yerel betik CI'nin
#             alti adimindan ucunu kosuyordu, yani "OK" demesi "CI gecer"
#             demek degildi.
jobs:
  matris:
    name: testler (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Python projesinin tamami backend/ altinda.
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # `uses:` adimlari working-directory'yi almaz; yol repo kokune goredir.
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[test]"

      - name: Hizli testler
        run: pytest -m "not slow"

      # Degismezler HER surumde kosar. Once yalnizca 3.12'deydi, oysa
      # `.replit` calisma ortami python-3.10 kullaniyor — yani urunun
      # gercekten kostugu surum, degismezlerin hic denenmedigi surumdu.
      - name: System health
        run: python -m spor_toto.health

      # URETILMIS DOSYALAR HER SURUMDE YENIDEN URETILIP DISKTEKIYLE
      # KARSILASTIRILIR — ve bu adim tam olarak bir gercek kirilmadan
      # dogdu.
      #
      # CPython 3.12 gomulu `sum()`i float'lar icin Neumaier telafili
      # toplamaya cevirdi. `super_toto_degerlendir` iki beklenen deger
      # uretiyor ve bunlar SURUMLENMIS `frontend/lib/super-toto-veri.json`a
      # yaziliyor: 3.10/3.11'de `5.890000000000001`, 3.12/3.13'te `5.89`.
      # Yani dosyanin BAYT icerigi onu ureten yorumlayiciya bagliydi ve
      # tazeligini bayt esitligiyle denetleyen iki bekci vardi — kod
      # degismeden CI'nin iki bacagi aylarca kirmizi kaldi.
      #
      # Kok neden `math.fsum` ile kapatildi ama SINIFI acikti: ayni
      # modulde float toplayan baska `sum()`lar var ve bugunku veriyle
      # sapmiyorlar — bu bir garanti degil bir tesadut. Asil bekci
      # duzeltmenin kendisi degil KARSILASTIRMADIR: dosyayi her
      # desteklenen surumde yeniden uret, diskteki ile ayni mi diye bak.
      # Matris zaten dort surum kosuyor, yani bedeli sifira yakin.
      #
      # BEKCININ TUTTUGU MUTASYONLA DENENDI (2026-09-03): `math.fsum`
      # geri `sum` yapilinca py3.10 bacagi "BAYAT" diyor, py3.13 demiyor
      # — cunku diskteki deger artik dogru yuvarlanmis olan. Onemli olan
      # da bu: matris 3.12 sinirinin IKI YANINI da kapsadigi icin
      # herhangi bir yorumlayici bagimliligi en az bir bacagi kirmiziya
      # cekiyor. Tek surumde kosan bir bekci bunu goremezdi.
      - name: Üretilmiş dosyalar bu sürümde de aynı mı
        run: |
          python scripts/super_toto_frontend.py --kontrol
          python scripts/api_sozlesme.py --kontrol
          python scripts/fiyat_kaynaklari.py --kontrol

  kapi:
    name: kalite kapisi (check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matristeki en dusuk surum: kapi da urunun kostugu zeminde kossun.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          # `frontend/package.json` -> engines ile ayni.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bagimliliklar
        run: |
          # BUTUN ekstralar kuruluyor ve gerekcesi tek cumle: bir ekstra
          # kurulmadiginda ona bagli testler ATLANIR, kapi yine yesil kalir
          # ve o yuzey HIC KOSMAZ. Sessiz atlama, kirmizi bir kapidan
          # kotudur — cunku korunuyor sanirsin.
          #
          # Olculdu (2026-09-03), yalnizca `[test]` ile kosan matris isinde
          # atlananlar: `test_agac.py`nin TAMAMI (lightgbm, modul duzeyi),
          # `test_arama` (sklearn), `test_mcp` (mcp), `test_bulten` (ocr).
          # `mcp` ve `ocr` bugune kadar HICBIR CI isinde kurulmamisti, yani
          # o iki test bir kez bile CI'da kosmadi.
          #
          # Uretim bunlarin hicbirini tasimaz (`scripts/run_prod.sh`), CI
          # tasir. `mcp` starlette+uvicorn getiriyor; bedeli kabul ediliyor
          # cunku alternatifi denetlenmeyen bir yuzey.
          pip install -e "./backend[test,kalite,model,mcp,ocr]"
          npm --prefix frontend ci

      # Yerelde kosulan komutun AYNISI. Tek satir olmasi kasitli: CI ile
      # yerel kapinin ayrisabilecegi hicbir yer kalmasin.
      - name: check.sh
        run: bash scripts/check.sh
